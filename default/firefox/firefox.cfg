// First line must be a comment
// Use defaultPref to set defaults that can be overridden

defaultPref("browser.urlbar.trimURLs", false);
defaultPref("browser.urlbar.placeholderName", "DuckDuckGo");
defaultPref("browser.urlbar.placeholderName.private", "DuckDuckGo");
defaultPref("browser.tabs.insertAfterCurrent", true);
defaultPref("browser.startup.page", 3); // 3 = restore previous session

// omarchy-theme-firefox-set drives the active theme, so don't let Sync fight it.
defaultPref("services.sync.prefs.sync.extensions.activeThemeID", false);

// Strict content blocking, matching the EnableTrackingProtection policy.
defaultPref("browser.contentblocking.category", "strict");

// Global Privacy Control: a header sites are legally obliged to honour, unlike DNT.
defaultPref("privacy.globalprivacycontrol.enabled", true);

// No speculative connections or DNS prefetch to hosts you haven't visited.
defaultPref("network.dns.disablePrefetch", true);
defaultPref("network.predictor.enabled", false);
defaultPref("network.prefetch-next", false);

// Don't let pages phone home on navigation/unload.
defaultPref("beacon.enabled", false);
defaultPref("browser.send_pings", false);

// Limit WebRTC to the default route so a call can't enumerate every local IP.
// Left enabled so Zoom/WhatsApp calls still work.
defaultPref("media.peerconnection.ice.default_address_only", true);

// Don't send typed URLs to the search engine as suggestions.
defaultPref("browser.search.suggest.enabled", false);
defaultPref("browser.urlbar.suggest.quicksuggest.sponsored", false);
defaultPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
