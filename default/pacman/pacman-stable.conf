# See the pacman.conf(5) manpage for option and repository directives

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# Branding this fork replaces. These live at package-owned paths that
# omarchy-dev-link cannot shadow, so without this an omarchy-settings upgrade
# puts the stock logos back. pacman writes its versions as .pacnew instead.
# /etc/plymouth/plymouthd.conf is NOT listed: omarchy-settings rewrites it from
# a post_upgrade scriptlet rather than through pacman, which NoUpgrade cannot
# intercept -- the post-update.d/restore-branding hook handles that one.
NoUpgrade = usr/share/plymouth/themes/omarchy/logo.png
NoUpgrade = usr/share/sddm/themes/omarchy/logo.png

# pacman searches repositories in the order defined here
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[omarchy]
Server = https://pkgs.omarchy.org/stable/$arch
